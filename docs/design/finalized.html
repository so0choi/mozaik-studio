<style>
:root{
  --bg:#FAF8F5;--surface:#FFFFFF;--ink:#1E2A4A;--muted:#636874;--line:#E7E3DC;
  --visible:#1F6E4A;--visible-bg:#E6F4EC;--warn:#F5A524;--warn-bg:#FFF4DB;
  --primary:#1E2A4A;--primary-hover:#2A3A63;--on-primary:#FFFFFF;--on-visible:#FFFFFF;
  --track:#EEEAE3;--seg-bg:#F1EEE8;--warn-ink:#8A5300;--ph:#E0533D;--focus:#2F6FED;--chk-line:#CFC9BE;
  --r-s:8px;--r-m:12px;--r-l:16px;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;
  --font:'SUIT',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#13161E;--surface:#1C202B;--ink:#E8EAF0;--muted:#9AA0AE;--line:#2D3242;
    --visible:#4CC38A;--visible-bg:#16342A;--warn:#F5A524;--warn-bg:#3A2D10;
    --primary:#3E5290;--primary-hover:#4A609F;--on-primary:#FFFFFF;--on-visible:#0B2A1D;
    --track:#2A2F3D;--seg-bg:#13161E;--warn-ink:#FFD27A;--ph:#FF7A66;--focus:#8FB0FF;--chk-line:#4A5164;
  }
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:var(--font);font-size:14px;line-height:1.45;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;overflow:clip;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:var(--s4);top:-60px;z-index:100;background:var(--primary);color:var(--on-primary);padding:var(--s3) var(--s4);border-radius:var(--r-s);font-weight:700}
.skip:focus{top:var(--s2)}
/* header */
.top{flex:none;min-height:64px;display:flex;align-items:center;flex-wrap:wrap;gap:var(--s3) var(--s4);padding:var(--s2) var(--s6);background:var(--surface);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:var(--s3);font-weight:800;font-size:18px;letter-spacing:-.02em}
.logo i{width:28px;height:28px;border-radius:var(--r-s);background:var(--primary);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:2px;padding:5px}
.logo i b{background:#FDFCF9;opacity:.9;border-radius:1px}.logo i b:nth-child(2n){opacity:.4}
.chipf{display:flex;align-items:center;gap:var(--s2);font-size:14px;color:var(--muted);padding:6px var(--s3);background:var(--bg);border-radius:var(--r-s);min-height:32px}
.chipf svg{width:14px;height:14px;flex:none}
.status{font-size:14px;color:var(--muted)}
.sp{flex:1}
.note{font-size:14px;font-weight:700;color:var(--warn-ink);background:var(--warn-bg);padding:6px var(--s3);border-radius:var(--r-s);min-height:32px;display:flex;align-items:center}
.note.ok{color:var(--visible);background:var(--visible-bg)}
.btn-primary{background:var(--primary);color:var(--on-primary);font-weight:700;font-size:15px;min-height:40px;padding:0 var(--s5);border-radius:10px;display:flex;gap:var(--s2);align-items:center;transition:background .15s}
.btn-primary:hover:not(:disabled){background:var(--primary-hover)}
.btn-primary:disabled{opacity:.4}
/* layout */
main{flex:1;min-height:0;display:grid;grid-template-columns:52% 48%}
.left{min-height:0;display:flex;flex-direction:column;padding:var(--s5) var(--s5) 0 var(--s6)}
.lhead{flex:none}
h1{font-size:24px;font-weight:800;letter-spacing:-.03em;line-height:1.2}
.hint{color:var(--muted);font-size:14px;margin-top:var(--s1)}
.gridwrap{flex:1;min-height:0;overflow-y:auto;margin-top:var(--s4);padding:2px var(--s2) 0 2px;margin-right:calc(var(--s2) * -1)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s4);padding-bottom:96px}
.gridwrap::-webkit-scrollbar{width:8px}.gridwrap::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
/* card */
.card{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:var(--r-m);padding:var(--s4) var(--s3) var(--s3);display:flex;flex-direction:column;align-items:center;text-align:center;transition:border-color .15s}
.card.shown{background:var(--visible-bg);border-color:var(--visible)}
.card.current{border-color:var(--ink)}
.card.shown.current{border-color:var(--visible);box-shadow:0 0 0 2px var(--visible)}
.chk{position:absolute;top:2px;left:2px;width:36px;height:36px;display:grid;place-items:center;border-radius:var(--r-s)}
.chk span{width:22px;height:22px;border-radius:6px;border:2px solid var(--chk-line);background:var(--surface);display:grid;place-items:center}
.chk svg{width:13px;height:13px;opacity:0;stroke:var(--on-primary)}
.card.sel .chk span{background:var(--primary);border-color:var(--primary)}.card.sel .chk svg{opacity:1}
.badge{position:absolute;top:var(--s3);right:var(--s3);font-size:12px;font-weight:700;color:var(--visible);background:var(--surface);padding:2px var(--s2);border-radius:99px;border:1px solid var(--visible)}
.avatar{width:80px;height:80px;border-radius:50%;overflow:hidden;background:var(--track);margin-top:var(--s1);padding:0;display:block}
.avatar svg{width:100%;height:100%;display:block;filter:blur(1.6px);transform:scale(1.04)}
.name{display:block;font-size:17px;line-height:22px;font-weight:800;margin-top:var(--s3);padding:0 var(--s1);border-radius:6px;min-width:60%;max-width:100%;overflow-wrap:anywhere;cursor:text}
.name:hover{background:var(--seg-bg)}
.sub{display:block;font-size:13px;line-height:18px;color:var(--muted);margin-top:2px}
.frags{display:flex;align-items:center;gap:6px;margin:var(--s3) 0;font-size:12px;color:var(--muted)}
.frags .t{width:24px;height:24px;border-radius:6px;overflow:hidden;background:var(--track)}
.frags .t svg{width:100%;height:100%;display:block;filter:blur(1px)}
.seg{display:grid;grid-template-columns:1fr 1fr;width:100%;background:var(--seg-bg);border-radius:10px;padding:3px;margin-top:auto}
.seg button{min-height:36px;font-size:14px;font-weight:700;border-radius:var(--r-s);color:var(--muted);transition:background .15s}
.seg button[aria-pressed="true"].hide{background:var(--primary);color:var(--on-primary)}
.seg button[aria-pressed="true"].show{background:var(--visible);color:var(--on-visible)}
/* group bar */
.bar{position:sticky;bottom:var(--s4);margin:-80px auto var(--s4);width:max-content;max-width:100%;background:var(--primary);color:var(--on-primary);border-radius:14px;padding:var(--s2) var(--s2) var(--s2) var(--s5);display:flex;align-items:center;gap:var(--s3);font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);transform:translateY(16px);opacity:0;visibility:hidden;transition:transform .2s,opacity .2s,visibility .2s}
.bar.on{transform:none;opacity:1;visibility:visible}
.bar b{font-weight:700}.bar .go{background:var(--surface);color:var(--ink);font-weight:800;min-height:36px;padding:0 var(--s4);border-radius:var(--r-s)}
.bar .cancel{min-height:36px;padding:0 var(--s3);opacity:.85}
/* right */
.right{min-height:0;overflow-y:auto;padding:var(--s5) var(--s6) var(--s4) var(--s2);display:flex;flex-direction:column;gap:var(--s3)}
.player{position:relative;aspect-ratio:16/9;border-radius:var(--r-m);overflow:hidden;background:#EDE6DA;flex:none;border:1px solid var(--line)}
.scene{position:absolute;inset:0;width:100%;height:100%}
.pp{position:absolute;bottom:9%;width:15%;aspect-ratio:100/160}
.pp svg.body{width:100%;height:100%;display:block}
.face{position:absolute;left:28%;top:11.25%;width:44%;height:27.5%;border-radius:38%;overflow:hidden}
.face.mos{display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(6,1fr);border-radius:18%}
.face svg{width:100%;height:100%;display:block}
.pp.cur::after{content:"";position:absolute;left:18%;top:6%;width:64%;height:36%;border:2px solid #fff;border-radius:10px;box-shadow:0 0 0 2px #1E2A4A;pointer-events:none}
.tag{position:absolute;left:50%;transform:translateX(-50%);top:-9%;font-size:11px;font-weight:700;background:#FDFCF9;color:#1E2A4A;padding:2px 6px;border-radius:99px;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.mbox{position:absolute;border:2px dashed var(--warn);background:rgba(245,165,36,.12);border-radius:4px}
.mbox em{position:absolute;top:-20px;left:-2px;font-style:normal;font-size:11px;font-weight:700;background:var(--warn);color:#2B1C00;padding:1px 6px;border-radius:4px;display:flex;align-items:center;gap:5px;white-space:nowrap}
.mbox .spin{width:10px;height:10px;border-width:2px;border-color:rgba(43,28,0,.3);border-top-color:#2B1C00}
.hl{position:absolute;border:2px dashed var(--warn);background:rgba(245,165,36,.14);border-radius:var(--r-s);pointer-events:none;transition:opacity .2s}
.hl.off{display:none}
.hl .cap{position:absolute;left:-2px;bottom:calc(100% + 2px);background:var(--warn);color:#2B1C00;font-size:12px;font-weight:700;padding:2px var(--s2);border-radius:6px;white-space:nowrap}
.hl .cap b{font-family:var(--mono);font-weight:700}
.player.draw{cursor:crosshair;outline:2px solid var(--warn);outline-offset:-2px}
.pctl{position:absolute;left:var(--s3);bottom:var(--s3);display:flex;align-items:center;gap:var(--s2);background:rgba(30,42,74,.88);color:#FDFCF9;border-radius:99px;padding:4px var(--s4) 4px 4px}
.pctl .play{width:36px;height:36px;border-radius:50%;background:#FDFCF9;display:grid;place-items:center;color:#1E2A4A}
.pctl .play svg{width:14px;height:14px;fill:#1E2A4A}
.pctl .ic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center}
.pctl .ic svg{width:16px;height:16px;fill:#fff}
.pctl .ic:hover{background:rgba(255,255,255,.18)}
.time{font-family:var(--mono);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}.time span{opacity:.7;font-weight:500}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:var(--s3) var(--s4)}
.tl-head{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s3);margin-bottom:var(--s3);font-size:13px}
.tl-head h2{font-weight:800;font-size:14px}.tl-head span{color:var(--muted)}
.tlw{position:relative;height:14px;margin:var(--s1) 0}
.track{position:absolute;inset:0;border-radius:7px;background:var(--track);cursor:pointer;overflow:hidden}
.track:focus-visible{overflow:visible}
.track .s{position:absolute;top:0;height:100%;background:var(--primary);border-radius:7px}
.ph{position:absolute;top:-5px;width:3px;height:24px;background:var(--ph);border-radius:2px;transform:translateX(-1px);pointer-events:none;z-index:2}
.mk{position:absolute;top:-9px;width:32px;height:32px;transform:translateX(-50%);z-index:3;display:grid;place-items:center}
.mk::after{content:"";width:8px;height:24px;border-radius:3px;background:var(--warn);box-shadow:0 0 0 2px var(--surface)}
.mk.res::after{background:var(--visible);height:18px}
.mk.act::after{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.ticks{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:var(--s2)}
.legend{display:flex;gap:var(--s3);font-size:12px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:8px;height:14px;border-radius:3px;background:var(--warn);vertical-align:-2px;margin-right:4px}.legend i.g{background:var(--visible)}
.tools{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap}
.btn-ghost{display:flex;align-items:center;gap:var(--s2);background:var(--surface);border:1.5px solid var(--ink);color:var(--ink);font-weight:700;font-size:14px;min-height:36px;padding:0 var(--s4);border-radius:10px}
.btn-ghost[aria-pressed="true"]{background:var(--warn-bg);border-color:var(--warn);color:var(--warn-ink)}
.btn-ghost svg{width:16px;height:16px}
.chip{display:flex;align-items:center;gap:var(--s2);font-size:13px;color:var(--muted);background:var(--surface);min-height:36px;padding:0 var(--s4);border-radius:99px;border:1px solid var(--line)}
.chip b{color:var(--ink);font-weight:700}
.spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:sp 1s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
/* review */
.review{display:flex;flex-direction:column;gap:var(--s2);min-height:0}
.rhd{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:var(--s2)}
.rhd h2{font-size:15px;font-weight:800}.rhd span{font-size:12px;color:var(--muted)}
.q{display:flex;align-items:center;flex-wrap:wrap;gap:var(--s2) var(--s3);border:1px solid var(--line);border-radius:10px;padding:var(--s2) var(--s3);margin-bottom:var(--s2);background:var(--surface);cursor:pointer}
.q:hover{border-color:var(--muted)}
.q.on{border-color:var(--warn);background:var(--warn-bg);box-shadow:0 0 0 2px var(--warn)}
.q .lab{flex:1 1 150px;min-width:0;display:block;font-size:14px;line-height:20px;font-weight:600;overflow-wrap:anywhere}
.q .t{font-family:var(--mono);font-size:13px;font-weight:700}
.q .acts{display:flex;gap:6px}
.q .acts button{min-height:32px;padding:0 var(--s3);border-radius:var(--r-s);font-size:13px;font-weight:700;border:1px solid var(--muted);background:var(--surface)}
.q .acts .ok{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.empty{padding:var(--s4);text-align:center;color:var(--visible);background:var(--visible-bg);border-radius:10px;font-weight:700}
.fold{width:100%;min-height:36px;display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:700;color:var(--muted);border-top:1px solid var(--line);padding-top:var(--s1)}
.chev{transition:transform .2s}.fold[aria-expanded="true"] .chev{transform:rotate(180deg)}
.dl{list-style:none;padding:0}
.dl li{display:flex;align-items:center;gap:var(--s2);padding:6px 2px;font-size:13px;border-top:1px solid var(--line)}
.dl .by{color:var(--muted);font-size:12px}.dl .t{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:var(--s6);transform:translate(-50%,24px);background:var(--primary);color:var(--on-primary);padding:var(--s3) var(--s5);border-radius:var(--r-m);font-weight:600;font-size:14px;opacity:0;visibility:hidden;transition:.25s;pointer-events:none;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.toast.on{opacity:1;visibility:visible;transform:translate(-50%,0)}
/* responsive */
@media (max-width:1024px){
  body{overflow:auto;height:auto;min-height:100%}
  main{display:block}
  .left{padding:var(--s5) var(--s4) 0}
  .gridwrap{overflow:visible;margin-right:0;padding:0}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));padding-bottom:var(--s4)}
  .bar{position:fixed;left:50%;bottom:var(--s4);margin:0;transform:translate(-50%,16px);z-index:40}
  .bar.on{transform:translate(-50%,0)}
  .right{overflow:visible;padding:var(--s5) var(--s4)}
  .top{padding:var(--s2) var(--s4)}
}
@media (max-width:768px){
  button,.seg button,.btn-ghost,.btn-primary,.q .acts button,.fold,.bar .go,.bar .cancel,.chip{min-height:44px}
  .chk{width:44px;height:44px;top:0;left:0}
  .mk{height:44px}
  .top{gap:var(--s2) var(--s3)}
  .btn-primary{width:100%;justify-content:center}
  .sp{display:none}
  .grid{gap:var(--s3)}
  .card{padding:var(--s3) var(--s2) var(--s2)}
  .q .acts{width:100%}.q .acts button{flex:1}
  .bar{width:calc(100% - 32px);flex-wrap:wrap;justify-content:center;padding:var(--s3)}
  .pctl{left:var(--s2);bottom:var(--s2);gap:var(--s1);padding-right:var(--s3)}
  .pctl .ic{width:44px;height:44px}.pctl .play{width:44px;height:44px}
  .hl .cap{font-size:11px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
}
button:active:not(:disabled){transform:translateY(1px)}
</style>
</head>

<header class="top">

  <div class="chipf"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="1.5" y="3" width="13" height="10" rx="2"/><path d="M6.5 6l3.5 2-3.5 2z" fill="currentColor"/></svg>store_live_1028.mp4</div>
  <span class="status" id="status">분석 완료 · 인물 8명</span>

</header>
<main id="main">
  <section class="left" aria-labelledby="title">
    <div class="lhead">
      <h1 id="title">등장인물 8명</h1>

    </div>
    <div class="gridwrap" id="gridwrap">
      <div class="grid" id="grid"></div>
      <div class="bar" id="bar" role="region" aria-label="선택한 인물 묶기"><span id="barText"><b>2개 선택됨</b></span><button class="go" id="merge">같은 사람으로 묶기</button><button class="cancel" id="cancel">취소</button></div>
    </div>
  </section>
  <section class="right" aria-label="미리보기와 검수">

      <svg class="scene" viewBox="0 0 640 360" preserveAspectRatio="none" aria-hidden="true">

<script>
const TOTAL=312;
const $=s=>document.querySelector(s);
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0');
const dur=s=>{const m=Math.floor(s/60),r=s%60;return (m?m+'분 ':'')+r+'초'};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let P=[
 {id:1,name:'진행자',skin:'#F1C9A5',hair:'#2B2B33',shirt:'#1E2A4A',frags:4,segs:[[0,120],[150,312]],show:true,pos:8},
 {id:2,name:'인물 2',skin:'#E3B08A',hair:'#6B4226',shirt:'#C86B5A',frags:2,segs:[[20,70],[200,260]],pos:70},
 {id:3,name:'인물 3',skin:'#C98E64',hair:'#1D1A1A',shirt:'#3F8F7B',frags:3,segs:[[40,100],[130,174],[240,270]],pos:28},
 {id:4,name:'인물 4',skin:'#F4D4B8',hair:'#B5803A',shirt:'#8A6FB8',frags:2,segs:[[10,40],[180,230]],pos:84},
 {id:5,name:'인물 5',skin:'#8D5A3C',hair:'#15110F',shirt:'#E0A83C',frags:1,segs:[[90,130]],pos:50},
 {id:6,name:'인물 6',skin:'#EBC09B',hair:'#8C8C93',shirt:'#5A7DB8',frags:2,segs:[[60,95],[220,250]],pos:48},
 {id:7,name:'인물 7',skin:'#D9A47E',hair:'#4A2A1A',shirt:'#B85A7D',frags:1,segs:[[260,300]],pos:60},
 {id:8,name:'인물 8',skin:'#F0C7A0',hair:'#2D3A5A',shirt:'#6DA36A',frags:3,segs:[[5,25],[110,140],[280,310]],pos:18}
];
const ORIG={};P.forEach(p=>ORIG[p.id]={...p});
const alias={};let sel=new Set(),cur=3,t=84,playing=false,iv=null,drawing=false;
let boxes=[{x:61,y:55,w:12,h:20,state:'done'}];
let items=[
 {id:'a',type:'낮은 신뢰도',who:'인물 4',pids:[4],tc:'00:42',f:42,cap:'낮은 신뢰도 구간 <b>00:42</b>'},
 {id:'b',type:'추적 끊김',who:'인물 2',pids:[2],tc:'01:24',f:84,cap:'추적 끊김 구간 <b>01:24–01:26</b>'},
 {id:'c',type:'교차 구간',who:'인물 1·5',pids:[1,5],tc:'03:10',f:190,cap:'교차 구간 <b>03:10</b>'}
];
let done=[],active='b';
const root=id=>{while(alias[id])id=alias[id];return id};
const get=id=>P.find(p=>p.id===root(id));
const total=p=>p.segs.reduce((a,s)=>a+s[1]-s[0],0);
function faceSVG(skin,hair){return `<svg viewBox="0 0 100 100"><rect width="100" height="100" fill="${skin}"/><path d="M0 0h100v34Q50 18 0 38z" fill="${hair}"/><circle cx="32" cy="55" r="5" fill="#2a2320"/><circle cx="68" cy="55" r="5" fill="#2a2320"/><path d="M34 76q16 12 32 0" stroke="#7A3B30" stroke-width="5" fill="none" stroke-linecap="round"/></svg>`}
function avatar(p,variant){const h=variant?['#2B2B33','#6B4226','#B5803A'][variant%3]:p.hair;const bg=['#F3E9D8','#E3ECF4','#EBE3F1','#E4F0E7'][p.id%4];
 return `<svg viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" fill="${bg}"/><path d="M8 100q4-26 42-26t42 26z" fill="${p.shirt}"/><rect x="42" y="62" width="16" height="16" fill="${p.skin}"/><ellipse cx="50" cy="44" rx="22" ry="25" fill="${p.skin}"/><path d="M27 44q-4-30 23-30t23 30q-8-16-23-16T27 44z" fill="${h}"/><circle cx="41" cy="46" r="2.4" fill="#2a2320"/><circle cx="59" cy="46" r="2.4" fill="#2a2320"/><path d="M42 58q8 6 16 0" stroke="#8A4A3A" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>`}
function body(p){return `<svg class="body" viewBox="0 0 100 160"><path d="M6 160q0-52 44-52t44 52z" fill="${p.shirt}"/><rect x="42" y="56" width="16" height="22" fill="${p.skin}"/><ellipse cx="50" cy="40" rx="25" ry="26" fill="${p.skin}"/></svg>`}
function mosaic(p){let h='';let r=p.id*7+3;for(let i=0;i<36;i++){r=(r*9301+49297)%233280;const v=r/233280;const row=Math.floor(i/6);
 const base=row<2?p.hair:p.skin;h+=`<i style="background:${base};filter:brightness(${(0.82+v*0.3).toFixed(2)})"></i>`}return h}
const relayout=()=>{try{window.ptRelayout&&window.ptRelayout()}catch(e){}};
function renderGrid(){
 $('#title').textContent=`등장인물 ${P.length}명`;
 $('#status').textContent=`분석 완료 · 인물 ${P.length}명`;
 $('#grid').innerHTML=P.map(p=>{const n=esc(p.name);return `<div class="card ${p.show?'shown':''} ${cur===p.id?'current':''} ${sel.has(p.id)?'sel':''}" data-id="${p.id}">
  <button class="chk" role="checkbox" aria-checked="${sel.has(p.id)}" aria-label="${n} 묶기 선택" data-chk="${p.id}"><span><svg viewBox="0 0 14 14" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 7.5l3 3 6-7"/></svg></span></button>
  ${p.show?'<span class="badge">보임</span>':''}
  <button class="avatar" data-cur="${p.id}" aria-label="${n} 등장 구간 보기" aria-pressed="${cur===p.id}">${avatar(p)}</button>
  <span class="name" data-pretext data-name="${p.id}" contenteditable="true" role="textbox" aria-label="인물 이름 편집" spellcheck="false">${n}</span>
  <span class="sub" data-pretext>등장 ${dur(total(p))}</span>
  <div class="frags">${[0,1,2].map(i=>`<span class="t">${avatar(p,i)}</span>`).join('')}<span>조각 ${p.frags}개</span></div>
  <div class="seg" role="group" aria-label="${n} 가림 또는 보임"><button class="hide" data-t="${p.id}" data-v="0" aria-pressed="${!p.show}">가림</button><button class="show" data-t="${p.id}" data-v="1" aria-pressed="${!!p.show}">보임</button></div>
 </div>`}).join('');
 const b=$('#bar');b.classList.toggle('on',sel.size>=2);$('#barText').innerHTML=`<b>${sel.size}개 선택됨</b>`;
}
function timeline(){
 const p=get(cur),tr=$('#track');
 tr.innerHTML=p.segs.map(([a,b])=>`<div class="s" style="left:${a/TOTAL*100}%;width:${(b-a)/TOTAL*100}%"></div>`).join('');
 $('#tlLabel').textContent=`${p.name} 등장 구간`;
 $('#tlInfo').textContent=`${p.segs.length}구간 · 총 ${dur(total(p))}`;
 $('#ph').style.left=t/TOTAL*100+'%';
 tr.setAttribute('aria-valuenow',t);tr.setAttribute('aria-valuetext',fmt(t));
 $('#time').innerHTML=`${fmt(t)} <span>/ ${fmt(TOTAL)}</span>`;
 $('#mks').innerHTML=[...items.map(i=>({...i,r:0})),...done.map(d=>({...d,r:1}))].map(m=>`<button class="mk${m.r?' res':''}${m.id===active?' act':''}" style="left:${m.f/TOTAL*100}%" data-mk="${m.id}" aria-label="${m.r?'확인 완료':'확인 필요'} ${m.type} ${m.tc}" title="${m.tc}"></button>`).join('');
}
function scene(){
 const forced=new Set((items.find(i=>i.id===active)||{pids:[]}).pids.map(root));
 let h='';
 [1,3,6,2,4,5,8,7].forEach(id=>{const p=get(id);if(!p||p.id!==id&&!P.includes(p))return;
  const o=ORIG[id];const here=p.segs.some(s=>t>=s[0]&&t<s[1]);if(!here&&!forced.has(id))return;
  h+=`<div class="pp ${p.id===cur?'cur':''}" data-pp="${id}" style="left:${o.pos}%;">${body(o)}${p.show?`<div class="face">${faceSVG(o.skin,o.hair)}</div>`:`<div class="face mos">${mosaic(o)}</div>`}${p.id===cur?`<span class="tag">${esc(p.name)}</span>`:''}</div>`});
 $('#people').innerHTML=h;
 $('#boxes').innerHTML=boxes.map((b,i)=>`<div class="mbox" style="left:${b.x}%;top:${b.y}%;width:${b.w}%;height:${b.h}%"><em>${b.state==='tracking'?'<i class="spin"></i>추적 중':'수동 박스'}</em></div>`).join('');
 const tr=boxes.filter(b=>b.state==='tracking').length;
 $('#mchip').innerHTML=`<b>수동 박스 ${boxes.length}</b>${tr?' · 추적 중 <i class="spin"></i>':''}`;
 placeHl();
}
function placeHl(){
 const hl=$('#hl'),it=items.find(i=>i.id===active);
 if(!it){hl.classList.add('off');return}
 const pl=$('#player').getBoundingClientRect();let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
 it.pids.forEach(id=>{const f=document.querySelector(`.pp[data-pp="${root(id)}"] .face`);if(!f)return;const r=f.getBoundingClientRect();x0=Math.min(x0,r.left);y0=Math.min(y0,r.top);x1=Math.max(x1,r.right);y1=Math.max(y1,r.bottom)});
 if(x0>1e8||!pl.width){hl.classList.add('off');return}
 const px=1.2,py=2.2;
 Object.assign(hl.style,{left:(x0-pl.left)/pl.width*100-px+'%',top:(y0-pl.top)/pl.height*100-py+'%',width:(x1-x0)/pl.width*100+px*2+'%',height:(y1-y0)/pl.height*100+py*2+'%'});
 $('#cap').innerHTML=it.cap;hl.classList.remove('off');
}
function renderQueue(){
 $('#queue').innerHTML=items.length?items.map(i=>`<div class="q${i.id===active?' on':''}" data-id="${i.id}">
  <span class="lab" data-pretext>${i.type} · ${i.who} · <span class="t">${i.tc}</span></span>
  <span class="acts"><button class="ok" data-a="ok" aria-label="${i.type} ${i.who} 괜찮음">괜찮음</button><button data-a="box" aria-label="${i.type} ${i.who} 박스 추가">박스 추가</button></span>
 </div>`).join(''):'<div class="empty">모든 항목 확인됨</div>';
 $('#cnt').textContent=`(${items.length})`;$('#dcnt').textContent=`(${done.length})`;
 $('#dlist').innerHTML=done.length?done.map(d=>`<li><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="var(--visible)"/><path d="M4.6 8.2l2.2 2.2 4.4-4.6" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>${d.type} · ${d.who}<span class="by">${d.by}</span><span class="t">${d.tc}</span></li>`).join(''):'<li>아직 없음</li>';
 const n=items.length,note=$('#note');
 const msg=n?`확인 필요 ${n}건 남음`:'모든 항목 확인됨';
 if(note.textContent!==msg)$('#live').textContent=msg;
 note.textContent=msg;note.classList.toggle('ok',!n);$('#render').disabled=!!n;
}
function renderAll(){renderGrid();renderQueue();timeline();scene();relayout()}
function setT(s){t=Math.max(0,Math.min(TOTAL,Math.round(s)));timeline();scene()}
const toast=m=>{const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove('on'),2200)};
/* grid */
$('#grid').addEventListener('click',e=>{
 if(e.target.closest('[contenteditable]'))return;
 const tg=e.target.closest('[data-t]');
 if(tg){const p=P.find(x=>x.id==tg.dataset.t);p.show=tg.dataset.v==='1';cur=p.id;renderGrid();timeline();scene();relayout();return}
 const ck=e.target.closest('[data-chk]');
 if(ck){const id=+ck.dataset.chk;sel.has(id)?sel.delete(id):sel.add(id);renderGrid();relayout();return}
 const c=e.target.closest('.card');if(c){cur=+c.dataset.id;renderGrid();timeline();scene();relayout()}
});
$('#grid').addEventListener('keydown',e=>{const n=e.target.closest('[data-name]');if(n&&e.key==='Enter'){e.preventDefault();n.blur()}});
$('#grid').addEventListener('input',e=>{const n=e.target.closest('[data-name]');if(n){const p=P.find(x=>x.id==n.dataset.name);if(p){p.name=n.textContent.trim()||p.name;timeline();scene()}}});
$('#grid').addEventListener('focusout',e=>{const n=e.target.closest('[data-name]');if(n){const p=P.find(x=>x.id==n.dataset.name);if(p&&!n.textContent.trim()){p.name='인물 '+p.id;n.textContent=p.name;timeline();scene()}}});
$('#cancel').onclick=()=>{sel.clear();renderGrid();relayout()};
$('#merge').onclick=()=>{
 const ids=[...sel].sort((a,b)=>a-b);if(ids.length<2)return;
 const keep=P.find(p=>p.id===ids[0]);
 ids.slice(1).forEach(id=>{const o=P.find(p=>p.id===id);keep.frags+=o.frags;keep.segs=keep.segs.concat(o.segs);keep.show=keep.show||o.show;alias[id]=keep.id});
 keep.segs.sort((a,b)=>a[0]-b[0]);
 const m=[];keep.segs.forEach(s=>{const l=m[m.length-1];if(l&&s[0]<=l[1])l[1]=Math.max(l[1],s[1]);else m.push([...s])});keep.segs=m;
 P=P.filter(p=>!alias[p.id]);cur=keep.id;sel.clear();renderAll();toast(`${keep.name}으로 묶였습니다`);
};
$('#render').onclick=()=>{if(!$('#render').disabled)toast('렌더 대기열에 추가됨 (데모)')};
/* timeline */
$('#tlw').addEventListener('click',e=>{if(e.target.closest('.mk')||e.target.closest('.ph'))return;const r=$('#track').getBoundingClientRect();setT((e.clientX-r.left)/r.width*TOTAL)});
$('#track').addEventListener('keydown',e=>{if(e.key==='ArrowRight'){setT(t+5);e.preventDefault()}else if(e.key==='ArrowLeft'){setT(t-5);e.preventDefault()}});
$('#mks').addEventListener('click',e=>{const m=e.target.closest('.mk');if(!m)return;const id=m.dataset.mk,it=items.find(i=>i.id===id);if(it)select(id);else{const d=done.find(x=>x.id===id);if(d)setT(d.f)}});
$('#back').onclick=()=>setT(t-5);
$('#play').onclick=()=>{playing=!playing;
 $('#play').setAttribute('aria-label',playing?'일시정지':'재생');
 $('#playIcon').innerHTML=playing?'<path d="M3.5 2h3v12h-3zM9.5 2h3v12h-3z"/>':'<path d="M4 2.5v11l9-5.5z"/>';
 clearInterval(iv);if(playing)iv=setInterval(()=>setT(t>=TOTAL?0:t+1),1000)};
/* review */
function select(id){active=id;const it=items.find(i=>i.id===id);if(it)t=it.f;renderQueue();timeline();scene();relayout()}
function resolve(id,by){
 const i=items.findIndex(x=>x.id===id);if(i<0)return;const it=items[i];
 items.splice(i,1);done.unshift({id:it.id,type:it.type,who:it.who,tc:it.tc,f:it.f,by});
 if(active===id){active=items.length?items[Math.min(i,items.length-1)].id:null;if(active)t=items.find(x=>x.id===active).f}
 renderQueue();timeline();scene();relayout();
}
function addBox(it){
 const f=document.querySelector(`.pp[data-pp="${root(it.pids[0])}"] .face`),pl=$('#player').getBoundingClientRect();
 if(!f)return;const r=f.getBoundingClientRect();
 const b={x:(r.left-pl.left)/pl.width*100-.6,y:(r.top-pl.top)/pl.height*100-1,w:r.width/pl.width*100+1.2,h:r.height/pl.height*100+2,state:'tracking'};
 boxes.push(b);scene();
 setTimeout(()=>{b.state='done';scene()},1500);
}
$('#queue').addEventListener('click',e=>{
 const q=e.target.closest('.q');if(!q)return;const id=q.dataset.id,a=e.target.closest('button')?.dataset.a;
 if(a==='ok')resolve(id,'괜찮음');
 else if(a==='box'){const it=items.find(x=>x.id===id);select(id);addBox(it);resolve(id,'수동 박스')}
 else select(id);
});
$('#fold').onclick=()=>{const o=$('#fold').getAttribute('aria-expanded')!=='true';$('#fold').setAttribute('aria-expanded',o);$('#dlist').hidden=!o};
/* draw boxes */
const pl=$('#player'),db=$('#draw');let st=null,tmp=null;
