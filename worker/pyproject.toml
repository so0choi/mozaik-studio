[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mosaic-worker"
version = "0.1.0"
description = "Face Mosaic Studio video worker"
requires-python = ">=3.11"
dependencies = [
  "opencv-contrib-python-headless>=4.9,<5",
  "numpy>=1.26",
  "redis>=5",
  "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "fakeredis>=2.23"]

[tool.setuptools]
packages = ["mosaic_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ""
